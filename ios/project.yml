name: EklabAdBlocker
options:
  bundleIdPrefix: dev.eklab
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
targets:
  EklabAdBlocker:
    type: application
    platform: iOS
    sources:
      - path: EklabAdBlocker
      - path: Shared
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: ProtectionWidget
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eklab.adblocker
        PRODUCT_NAME: EklabAdBlocker
        PRODUCT_MODULE_NAME: EklabAdBlocker
        INFOPLIST_FILE: EklabAdBlocker/Info.plist
        CODE_SIGN_ENTITLEMENTS: EklabAdBlocker/EklabAdBlocker.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: EklabAdBlocker/Info.plist
      properties:
        CFBundleDisplayName: Traffic Inspector
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - dev.eklab.adblocker.retention
        UIBackgroundModes:
          - processing
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eklab.adblocker.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        PRODUCT_MODULE_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Traffic Inspector Tunnel
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
  ProtectionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ProtectionWidget
      - path: Shared/Store/AppGroup.swift
      - path: Shared/Core/Models.swift
      - path: Shared/Store/SettingsStore.swift
      - path: EklabAdBlocker/Vpn/ProtectionTunnelController.swift
      - path: EklabAdBlocker/Vpn/ProtectionWidgets.swift
      - path: EklabAdBlocker/Intents/ToggleProtectionIntent.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eklab.adblocker.ProtectionWidget
        PRODUCT_NAME: ProtectionWidget
        PRODUCT_MODULE_NAME: ProtectionWidget
        INFOPLIST_FILE: ProtectionWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProtectionWidget/ProtectionWidget.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: ProtectionWidget/Info.plist
      properties:
        CFBundleDisplayName: Protection
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  EklabAdBlockerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EklabAdBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eklab.adblocker.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EklabAdBlocker.app/EklabAdBlocker"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  EklabAdBlocker:
    build:
      targets:
        EklabAdBlocker: all
        PacketTunnel: all
        ProtectionWidget: all
        EklabAdBlockerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EklabAdBlockerTests
